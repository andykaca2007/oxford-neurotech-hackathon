; SwallowCue Plan B: GY-521 (MPU-6050) or GY-6500 on the throat, no EMG needed.
; Board: the ESP32 DevKit from the ELEGOO ESP-32 Super Starter Kit.
;
; Build:  pio_build env=esp32dev
; Tests:  pio_test env=native   (runs the detector on your laptop, no board)

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
test_ignore = test_native

[env:native]
platform = native
build_flags = -std=c++17
lib_compat_mode = off
